name: Auto-merge Elysium updates

on:
  workflow_run:
    workflows:
      - Unit tests
      - Native builds
    types:
      - completed

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  merge:
    name: Merge validated Elysium update
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Verify and merge dependency update
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = context.payload.workflow_run.head_sha;
            const requiredWorkflows = ["Unit tests", "Native builds"];

            const associatedPulls = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              {
                owner,
                repo,
                commit_sha: headSha,
                per_page: 100
              }
            );

            const pull = associatedPulls.find(candidate =>
              candidate.state === "open" &&
              candidate.base.ref === "main" &&
              candidate.user?.login === "dependabot[bot]" &&
              candidate.head.ref.startsWith("dependabot/nuget/")
            );

            if (!pull) {
              core.notice("No open Dependabot NuGet pull request is associated with this workflow run.");
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pull.number,
              per_page: 100
            });

            if (files.length !== 1 || files[0].filename !== "Directory.Build.props") {
              core.setFailed("The dependency pull request contains changes outside Directory.Build.props.");
              return;
            }

            async function readFile(ref) {
              const response = await github.rest.repos.getContent({
                owner,
                repo,
                path: "Directory.Build.props",
                ref
              });

              if (Array.isArray(response.data) || response.data.type !== "file") {
                throw new Error("Directory.Build.props did not resolve to a file.");
              }

              return Buffer.from(response.data.content, "base64").toString("utf8");
            }

            const baseContent = await readFile(pull.base.sha);
            const headContent = await readFile(pull.head.sha);
            const versionPattern = /<ElysiumVersion>([^<]+)<\/ElysiumVersion>/;
            const baseMatch = baseContent.match(versionPattern);
            const headMatch = headContent.match(versionPattern);

            if (!baseMatch || !headMatch || baseMatch[1] === headMatch[1]) {
              core.setFailed("The pull request does not contain one ElysiumVersion update.");
              return;
            }

            const normalizedBase = baseContent.replace(
              versionPattern,
              "<ElysiumVersion>VERSION</ElysiumVersion>"
            );
            const normalizedHead = headContent.replace(
              versionPattern,
              "<ElysiumVersion>VERSION</ElysiumVersion>"
            );

            if (normalizedBase !== normalizedHead) {
              core.setFailed("Directory.Build.props contains changes other than ElysiumVersion.");
              return;
            }

            const workflowRuns = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner,
                repo,
                event: "pull_request",
                head_sha: headSha,
                per_page: 100
              }
            );

            for (const workflowName of requiredWorkflows) {
              const workflowRun = workflowRuns
                .filter(candidate => candidate.name === workflowName && candidate.head_sha === headSha)
                .sort((left, right) => new Date(right.created_at) - new Date(left.created_at))[0];

              if (!workflowRun || workflowRun.status !== "completed") {
                core.notice(`${workflowName} has not completed for ${headSha}.`);
                return;
              }

              if (workflowRun.conclusion !== "success") {
                core.setFailed(`${workflowName} did not succeed for ${headSha}.`);
                return;
              }
            }

            const currentPull = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pull.number
            });

            if (currentPull.data.state !== "open" || currentPull.data.head.sha !== headSha) {
              core.notice("The dependency pull request changed while validation was running.");
              return;
            }

            if (currentPull.data.mergeable_state === "behind") {
              await github.rest.pulls.updateBranch({
                owner,
                repo,
                pull_number: pull.number,
                expected_head_sha: headSha
              });
              core.notice("Updated the dependency branch; checks will run again before merging.");
              return;
            }

            const merge = await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pull.number,
              merge_method: "squash",
              sha: headSha,
              commit_title: `Update Elysium packages to ${headMatch[1]}`
            });

            if (!merge.data.merged) {
              core.setFailed(merge.data.message || "GitHub did not merge the dependency pull request.");
              return;
            }

            core.notice(`Merged Elysium ${baseMatch[1]} to ${headMatch[1]}.`);
